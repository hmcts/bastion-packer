name: Bastion Packer

schedules:
  # Run once a week
  - cron: '0 3 * * 1' # Every monday at 3am UTC
    displayName: Weekly scheduled build # friendly name given to a specific schedule
    branches:
      include:
        - master
    always: true

trigger:
  branches:
    include:
      - master
  paths:
    include:
      - azure-pipelines.yml
      - ubuntu.pkr.hcl
      - provision-bastion.sh

pr:
  branches:
    include:
      - master

parameters:
  - name: buildImage
    displayName: Build an image on a non-master branch (creates Azure resources)
    type: boolean
    default: false

variables:
  - name: buildImages
    value: $[or(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq('${{ parameters.buildImage }}', 'true'))]
  - name: os_version
    value: '24.04'

stages:
  - stage: build
    jobs:
      - job: get_azure_image_version
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: Get latest azure image version
            name: get_azure_image_version
            inputs:
              azureSubscription: DTS-MANAGEMENT-PROD-INTSVC-WIF
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                AZURE_IMAGE_VERSION=$(az sig image-version list --gallery-image-definition bastion-ubuntu-v2 --gallery-name hmcts --resource-group hmcts-image-gallery-rg --query "[?starts_with(name, '$(os_version).')].{name:name}" -o tsv | sort -V | tail -n1)

                if [ -z "$AZURE_IMAGE_VERSION" ]; then
                    AZURE_IMAGE_VERSION="$(os_version).0"
                else
                    IFS=. read -r major minor patch <<<"$AZURE_IMAGE_VERSION"
                    ((patch++))
                    printf -v AZURE_IMAGE_VERSION '%d.%02d.%d' "$major" "$minor" "$((patch))"
                fi

                echo $AZURE_IMAGE_VERSION
                echo "##vso[task.setvariable variable=azure_image_version;isoutput=true]$AZURE_IMAGE_VERSION"

      - job: build_image
        pool:
          vmImage: 'ubuntu-latest'
        dependsOn: get_azure_image_version
        strategy:
          matrix:
            Ubuntu:
              os: Ubuntu
              image_name: bastion-ubuntu-v2
              templatePath: ubuntu.pkr.hcl
        variables:
          azure_image_version: $[ dependencies.get_azure_image_version.outputs['get_azure_image_version.azure_image_version'] ]
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Delete any lingering packer resource groups
            name: delete_packer_resource_groups
            condition: and(succeeded(), eq(variables['buildImages'], 'true'))
            inputs:
              azureSubscription: DTS-MANAGEMENT-PROD-INTSVC-WIF
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                groups=$(az group list --tag 'imagetype=$(image_name)' | jq -r '.[].name')
                for group in ${groups[@]}; do
                echo "deleting resource group $group"
                az group delete --name $group --yes
                done

          - task: AzureCLI@2
            displayName: Delete published image from previous failure
            condition: and(succeededOrFailed(), eq(variables['buildImages'], 'true'), ne(variables['Build.SourceBranch'], 'refs/heads/master'))
            name: delete_failed_pr_image
            inputs:
              azureSubscription: DTS-MANAGEMENT-PROD-INTSVC-WIF
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                if az sig image-version show --gallery-image-version $(Build.BuildId).0.0 --gallery-image-definition $(image_name) --gallery-name hmcts --resource-group hmcts-image-gallery-rg --output none 2>/dev/null; then
                  az sig image-version delete --gallery-image-version $(Build.BuildId).0.0 --gallery-image-definition $(image_name) --gallery-name hmcts --resource-group hmcts-image-gallery-rg
                fi

          - task: riezebosch.Packer.PackerTool.PackerTool@0
            displayName: 'Install Packer'
            inputs:
              version: 1.9.1

          - task: AzureCLI@2
            displayName: Init and validate Packer using WIF
            inputs:
              azureSubscription: DTS-MANAGEMENT-PROD-INTSVC-WIF
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                export PKR_VAR_subscription_id=$(az account show --query id -o tsv)
                packer init "$(templatePath)"
                packer validate "$(templatePath)"

          - task: AzureCLI@2
            displayName: PR Build
            condition: and(succeeded(), eq(variables['buildImages'], 'true'), ne(variables['Build.SourceBranch'], 'refs/heads/master'))
            inputs:
              azureSubscription: DTS-MANAGEMENT-PROD-INTSVC-WIF
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                export PKR_VAR_subscription_id=$(az account show --query id -o tsv)
                export PKR_VAR_azure_image_version="$(Build.BuildId).0.0"
                export PKR_VAR_temporary_resource_group_name="pkr-bastion-$(Build.BuildId)"
                packer build --only=azure-arm.pr-azure-os-image "$(templatePath)"

          - task: AzureCLI@2
            displayName: Cleanup resources on fail
            condition: and(failed(), eq(variables['buildImages'], 'true'))
            inputs:
              azureSubscription: DTS-MANAGEMENT-PROD-INTSVC-WIF
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                if [[ "$(az group exists --name 'pkr-bastion-$(Build.BuildId)')" == "true" ]]; then
                  az group delete --name "pkr-bastion-$(Build.BuildId)" --yes
                fi

          - task: AzureCLI@2
            displayName: Delete published PR build image version
            condition: and(succeededOrFailed(), eq(variables['buildImages'], 'true'), ne(variables['Build.SourceBranch'], 'refs/heads/master'))
            name: delete_pr_azure_image_version
            inputs:
              azureSubscription: DTS-MANAGEMENT-PROD-INTSVC-WIF
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                if az sig image-version show --gallery-image-version $(Build.BuildId).0.0 --gallery-image-definition $(image_name) --gallery-name hmcts --resource-group hmcts-image-gallery-rg --output none 2>/dev/null; then
                  az sig image-version delete --gallery-image-version $(Build.BuildId).0.0 --gallery-image-definition $(image_name) --gallery-name hmcts --resource-group hmcts-image-gallery-rg
                fi

          - task: AzureCLI@2
            displayName: Master Build
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
            inputs:
              azureSubscription: DTS-MANAGEMENT-PROD-INTSVC-WIF
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                export PKR_VAR_subscription_id=$(az account show --query id -o tsv)
                export PKR_VAR_azure_image_version="$(azure_image_version)"
                export PKR_VAR_temporary_resource_group_name="pkr-bastion-$(Build.BuildId)"
                packer build --only=azure-arm.azure-os-image "$(templatePath)"

  - stage: release
    jobs:
      - job: publish_release
        pool:
          vmImage: 'ubuntu-latest'
        variables:
          azure_image_version: $[ stageDependencies.build.get_azure_image_version.outputs['get_azure_image_version.azure_image_version'] ]
        steps:
          - checkout: self

          - task: GitHubRelease@1
            displayName: Create GitHubRelease
            condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/master'))
            inputs:
              gitHubConnection: 'GitHub Management - Full Repo Access'
              repositoryName: '$(Build.Repository.Name)'
              action: 'create'
              target: '$(Build.SourceVersion)'
              tagSource: 'userSpecifiedTag'
              tag: '$(azure_image_version)'
              title: '$(azure_image_version)'
              releaseNotesSource: inline
              releaseNotesInline: 'Regular maintenance updates for non-pinned packages'
              addChangeLog: true
              compareWith: 'lastFullRelease'
